plugins {
    id "dev.architectury.loom" version "1.17.493" apply false
    id "architectury-plugin" version "3.5.170"
    id "com.gradleup.shadow" version "9.6.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = project.maven_group
    version = "${project.mod_version}+${project.minecraft_version}"
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    base {
        archivesName = "${rootProject.mod_id}-${project.name}"
    }

    repositories {
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.neoforged.net/releases/" }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        compileOnly "com.google.code.findbugs:jsr305:3.0.2"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.parchment_minecraft_version}:${rootProject.parchment_mappings_version}@zip")
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = rootProject.java_version as int
    }

    tasks.withType(ProcessResources).configureEach {
        def props = [
                mod_id                : rootProject.mod_id,
                mod_name              : rootProject.mod_name,
                mod_license           : rootProject.mod_license,
                mod_version           : rootProject.mod_version,
                mod_author            : rootProject.mod_author,
                minecraft_version     : rootProject.minecraft_version,
                minecraft_version_range: rootProject.minecraft_version_range,
                fabric_loader_version : rootProject.fabric_loader_version,
                forge_version_range   : rootProject.findProperty("forge_version_range") ?: "",
                neoforge_version_range: rootProject.findProperty("neoforge_version_range") ?: "",
                java_version          : rootProject.java_version
        ]
        inputs.properties props
        filesMatching(["fabric.mod.json", "META-INF/mods.toml", "META-INF/neoforge.mods.toml"]) {
            expand props
        }
    }

    tasks.named("jar") {
        from(rootProject.file("LICENSE")) { rename { "LICENSE_${rootProject.mod_id}" } }
    }
}

tasks.register("collectJars") {
    def platforms = project.enabled_platforms.split(",")
    dependsOn platforms.collect { ":${it}:remapJar" }
    def distDir = file("dist")
    doLast {
        distDir.mkdirs()
        platforms.each { name ->
            def jar = project(":${name}").tasks.named("remapJar").get().archiveFile.get().asFile
            java.nio.file.Files.copy(jar.toPath(), new File(distDir, jar.name).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}
