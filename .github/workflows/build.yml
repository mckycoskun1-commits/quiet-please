name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Stonecutter and the 26.x versions need Gradle on Java 25. The older versions
      # compile for Java 17 or 21; the Gradle toolchain downloads those JDKs itself.
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every Minecraft version and loader (18 jars) ends up in dist/
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build collectJars --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: quietplease-jars
          path: dist/*.jar
