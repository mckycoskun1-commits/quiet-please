name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Gradle and Loom need Java 21 or newer to run; an older java_version (17) is
      # only the compile target, and the Gradle toolchain downloads that JDK itself.
      - name: Read the Java version of this branch
        id: java
        run: |
          version=$(grep '^java_version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          version=${version:-21}
          if [ "$version" -lt 21 ]; then version=21; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
