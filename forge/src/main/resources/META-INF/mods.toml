modLoader="javafml"
loaderVersion="[0,)"
license="${mod_license}"
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayTest="IGNORE_ALL_VERSION"
logoFile="quietplease.png"
credits="Disc and note block icons in the panel are Minecraft's own items."
authors="${mod_author}"
description='''
Take control of the music in your modpack.

Quiet Please lists every music track the game knows about, grouped by the mod it comes from. Turn off the tracks you don't like, lower the ones that are too loud, or preview any track before deciding.

- Per-track volume (0-100%) and on/off switch
- Disable all music of a mod with one click
- Search, mod filter and in-panel preview
- Background playlist with its own queue, skip button and repeat/shuffle
- Music gap setting: shorten or remove the long silence between songs
- Presets: /quietplease export <name> and import <name>
- Optional key bindings to open the panel and skip a song (Controls, Key Binds)
- Open it from the pause menu, Options or Music & Sounds (top-right Quiet Please button)
- Client-side only: works on any server, no server install needed
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
