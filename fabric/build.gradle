dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    compileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") { transitive = false }
}

configurations {
    productionRuntimeMods
}

dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(configurations.productionRuntimeMods)
    mods.from(tasks.named("jar"))
}
